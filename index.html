<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00981a 追蹤神器</title>
    <!-- 使用 Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 頂部導航 -->
        <header class="header">
            <div class="logo-area">
                <div class="logo-icon">📊</div>
                <h1>00981a 追蹤神器</h1>
            </div>
            <div class="controls">
                <label for="date-select">日期：</label>
                <select id="date-select" class="glass-select"></select>
            </div>
        </header>

        <!-- 摘要卡片 -->
        <section class="summary-cards">
            <div class="card glass-card">
                <h3>最大買進持股</h3>
                <div id="top-buy" class="card-content">
                    <span class="symbol">--</span>
                    <span class="value buy">--</span>
                </div>
            </div>
            <div class="card glass-card">
                <h3>最大賣出持股</h3>
                <div id="top-sell" class="card-content">
                    <span class="symbol">--</span>
                    <span class="value sell">--</span>
                </div>
            </div>
            <div class="card glass-card">
                <h3>總變化檔數</h3>
                <div id="total-changes" class="card-content">
                    <span class="value neutral">--</span>
                </div>
            </div>
        </section>

        <!-- 資料表格 -->
        <section class="table-container glass-card">
            <div class="table-header">
                <h2>成分股異動明細</h2>
                <div class="table-actions">
                    <!-- 可以放搜尋框或過濾按鈕 -->
                    <input type="text" id="search-input" class="glass-input" placeholder="搜尋代號或名稱...">
                </div>
            </div>
            <div class="table-wrapper">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th data-sort="ChangeType">變化類別 <span class="sort-icon">↕</span></th>
                            <th data-sort="Symbol">代號 <span class="sort-icon">↕</span></th>
                            <th data-sort="Name">名稱 <span class="sort-icon">↕</span></th>
                            <th data-sort="SharesChange" class="num-col">股數變化 <span class="sort-icon">↕</span></th>
                            <th data-sort="WeightChange" class="num-col">權重變化(%) <span class="sort-icon">↕</span></th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- 資料由 JS 動態載入 -->
                    </tbody>
                </table>
            </div>
            <div id="loading-spinner" class="loading">載入中...</div>
        </section>
    </div>

    <!-- 載入解析 CSV 的工具 -->
    <script src="app.js"></script>
</body>
</html>
